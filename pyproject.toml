[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-bimanual-insertion"
version = "0.1.0"
description = "Dual-Franka variable-impedance peg-in-hole research scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "mujoco>=3.1", "matplotlib>=3.7"]

[project.optional-dependencies]
rl = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
